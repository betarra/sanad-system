<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام سند - لوحة الإدارة والبحث</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Tahoma', sans-serif; 
            background: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .container { 
            width: 100%; 
            max-width: 480px; 
            background: #fff; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            overflow: hidden; 
            border: 1px solid #e1e4e8;
        }
        .header-title {
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
        }
        .search-section {
            padding: 20px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
        }
        .search-section input { 
            flex: 1; 
            padding: 12px 15px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-section input:focus { border-color: #1e3a8a; }
        .search-section button { 
            padding: 12px 20px; 
            background: #1e3a8a; 
            color: #fff; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold;
            cursor: pointer; 
            transition: background 0.2s;
        }
        .search-section button:hover { background: #1e40af; }
        
        /* تصميم البطاقة الداخلية */
        .card-content {
            padding: 25px;
            background: #ffffff;
            text-align: center;
        }
        .profile-img { 
            width: 90px; 
            height: 90px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid #1e3a8a;
            margin: 0 auto 20px auto; 
            display: block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .info-box { 
            margin-bottom: 15px; 
            background: #f8fafc;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #f1f5f9;
            text-align: right;
        }
        .info-box label { 
            font-size: 12px;
            color: #64748b; 
            display: block; 
            margin-bottom: 4px; 
            font-weight: bold;
        }
        .info-box span {
            font-size: 15px;
            color: #1e293b;
            font-weight: bold;
        }
        .status-badge { 
            background: #10b981; 
            color: #fff; 
            padding: 12px; 
            border-radius: 8px; 
            font-weight: bold;
            font-size: 15px;
            margin-top: 20px; 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        
        /* مكان الختم فقط في المنتصف */
        .stamp-section {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #cbd5e1;
        }
        .stamp-circle {
            width: 80px;
            height: 80px;
            border: 2px dashed #1e3a8a;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            color: #1e3a8a;
            font-weight: bold;
            background: #f8fafc;
            transform: rotate(-10deg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            padding: 15px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">نظام سند - لوحة الإدارة والبحث</div>
    
    <!-- خانة البحث -->
    <div class="search-section">
        <input type="text" id="militaryIdInput" placeholder="أدخل الرقم العسكري...">
        <button onclick="searchWounded()">بحث</button>
    </div>

    <!-- مكان ظهور البطاقة -->
    <div id="resultCard">
        <div style="padding: 40px 20px; text-align: center; color: #94a3b8;">
            الرجاء إدخال الرقم العسكري لعرض البطاقة...
        </div>
    </div>

    <div class="footer-note">جهة الإصدار: مديرية الجرحى | موثق إلكترونياً ومعتمد رسمياً</div>
</div>

<script>
    let database = JSON.parse(localStorage.getItem('sanad_database')) || {
        "c199796": {
            name: "أحمد محمد العلي",
            id: "c199796",
            service: "أولوية في معاملات النقل والمرور والدائر الرسمية",
            status: "معتمد رسمياً ✔",
            img: "logo.jpg"
        }
    };

    function searchWounded() {
        const inputVal = document.getElementById('militaryIdInput').value.trim();
        const resultCard = document.getElementById('resultCard');

        if (!inputVal) {
            alert('الرجاء إدخال رقم عسكري صحيح');
            return;
        }

        if (!database[inputVal]) {
            database[inputVal] = {
                name: "مستفيد جديد (" + inputVal + ")",
                id: inputVal,
                service: "أولوية في الخدمات العامة",
                status: "معتمد رسمياً ✔",
                img: "logo.jpg"
            };
            localStorage.setItem('sanad_database', JSON.stringify(database));
        }

        const person = database[inputVal];

        resultCard.innerHTML = `
            <div class="card-content">
                <img src="${person.img}" alt="صورة المستفيد" class="profile-img">
                <div class="info-box">
                    <label>الاسم الثلاثي:</label>
                    <span>${person.name}</span>
                </div>
                <div class="info-box">
                    <label>الرقم العسكري:</label>
                    <span>${person.id}</span>
                </div>
                <div class="info-box">
                    <label>نوع التسهيلات الممنوحة:</label>
                    <span>${person.service}</span>
                </div>
                <div class="status-badge">${person.status}</div>
                
                <!-- مكان الختم فقط -->
                <div class="stamp-section">
                    <div class="stamp-circle">ختم المديرية</div>
                </div>
            </div>
        `;
    }
</script>

</body>
</html>
